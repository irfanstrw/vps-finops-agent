<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPS FinOps Agent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <span id="loginLogo"></span>
      <h1>VPS FinOps Agent</h1>
      <p class="muted">Biaya server kamu di AWS, Azure, dan Google Cloud dalam satu dashboard.</p>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">Masuk</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <a class="skip" href="#" id="skip">Lewati ke konten</a>
    <header class="topbar">
      <button id="menuBtn" class="btn small menu-btn" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
      <a class="brand" href="#/overview"><span id="brandLogo"></span>VPS FinOps Agent</a>
      <div class="top-right">
        <span id="balancePill" class="balance"></span>
        <button id="themeBtn" class="btn small" type="button">Mode terang</button>
        <button id="logoutBtn" class="btn small" type="button">Keluar</button>
      </div>
    </header>
    <aside id="sidebar" class="sidebar">
      <button id="newChatBtn" class="btn primary wide" type="button">Percakapan baru</button>
      <nav class="nav" aria-label="Menu utama">
        <div class="nav-label">Analisis</div>
        <a href="#/overview" data-nav="overview">Dashboard</a>
        <a href="#/plan" data-nav="plan">Planning</a>
        <a href="#/automations" data-nav="automations">Automations</a>
        <div class="nav-label">Data dan pengaturan</div>
        <a href="#/artifacts" data-nav="artifacts">Artifacts</a>
        <a href="#/context" data-nav="context">Context files</a>
        <a href="#/integrations" data-nav="integrations">Integrations</a>
      </nav>
      <div class="nav-label label-row"><span>Percakapan</span><button id="clearChats" class="link small hidden" type="button">Hapus semua</button></div>
      <div id="recent" class="recent"></div>
      <div class="sidebar-foot">AWS, Azure, Google Cloud. Read-only.</div>
    </aside>
    <div id="scrim" class="scrim"></div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-label="Dialog" tabindex="-1"></div></div>
  <script src="/logos.js" defer></script>
  <script src="/charts.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/page-overview.js" defer></script>
  <script src="/page-plan.js" defer></script>
  <script src="/page-cloud.js" defer></script>
</body>
</html>
